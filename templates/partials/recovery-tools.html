<div data-recovery-tools class="border rounded p-3 my-3 hidden">
    <p data-recovery-status class="small mb-2" role="status"></p>
    <p data-recovery-reminder class="small text-primary hidden"></p>
    <div class="d-flex flex-wrap gap-2">
        <button type="button" data-recovery-download class="btn btn-outline-primary btn-sm">Download recovery file</button>
        <button type="button" data-recovery-csv class="btn btn-outline-secondary btn-sm">Download completed rows (CSV)</button>
    </div>
    <p class="small text-muted mt-2 mb-0">Recovery files include source data, results and settings, without API keys. Import one on the first step to resume. Keep your laptop awake while processing.</p>
</div>
